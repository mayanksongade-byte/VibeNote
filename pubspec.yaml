name: vibenote
description: "A modern Flutter notes app with reminders, app lock, voice notes, image notes, and glassmorphism UI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8
  share_plus: ^10.0.2
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  speech_to_text: ^7.4.0
  image_picker: ^1.2.2
  rainbow_edge_lighting: ^1.1.0
  flutter_colorpicker: ^1.1.0
  permission_handler: ^12.0.3
  slide_countdown: ^2.0.2
  local_auth: ^2.3.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/Icon_without_text.png"
  adaptive_icon_background: "#1A1333"
  adaptive_icon_foreground: "assets/logo/Icon_without_text.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/Vibe_note_illustration_1.png
    - assets/sounds/
